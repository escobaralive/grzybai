<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GrzybAI Live</title>
<style>
:root{--blue:#0787ff;--cyan:#00e5ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#fff}
#app{position:fixed;inset:0;background:#000}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#101010}
#fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:35px;color:#bbb;background:radial-gradient(circle,#1b1b1b,#050505 65%);font-size:16px}
.ui{position:absolute;inset:0;pointer-events:none}
.top{padding:calc(env(safe-area-inset-top) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:21px;font-weight:900;text-shadow:0 2px 5px #000}
.live{background:#e53935;border-radius:20px;padding:8px 13px;font-weight:800;font-size:13px;box-shadow:0 3px 12px #0008}
.status{position:absolute;top:calc(env(safe-area-inset-top) + 65px);left:50%;transform:translateX(-50%);background:#000a;border:1px solid #ffffff22;padding:7px 12px;border-radius:16px;font-size:12px;white-space:nowrap}
.scan{position:absolute;left:50%;top:44%;width:min(72vw,310px);height:min(47vw,205px);transform:translate(-50%,-50%);border:2px solid var(--cyan);border-radius:18px;box-shadow:0 0 22px #00e5ff77}
.c{position:absolute;width:32px;height:32px;border-color:#fff;border-style:solid}
.tl{left:-2px;top:-2px;border-width:6px 0 0 6px}.tr{right:-2px;top:-2px;border-width:6px 6px 0 0}
.bl{left:-2px;bottom:-2px;border-width:0 0 6px 6px}.br{right:-2px;bottom:-2px;border-width:0 6px 6px 0}
.scanline{position:absolute;left:5%;right:5%;top:15%;height:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:scan 2.2s linear infinite}
@keyframes scan{0%{top:12%}50%{top:88%}100%{top:12%}}
.tag{position:absolute;left:50%;top:calc(44% + min(27vw,118px));transform:translateX(-50%);background:var(--blue);padding:10px 15px;border-radius:9px;font-size:16px;font-weight:900;white-space:nowrap;box-shadow:0 5px 18px #0009}
.conf{position:absolute;left:50%;top:calc(44% + min(27vw,118px) + 48px);transform:translateX(-50%);background:#000c;padding:5px 10px;border-radius:13px;font-size:12px;white-space:nowrap}
.bottom{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px)}
.warn{background:#ffb300;color:#111;border-radius:11px;padding:10px 12px;text-align:center;font-size:11px;font-weight:800;margin-bottom:10px}
.row{display:flex;gap:9px;pointer-events:auto}
button{border:0;border-radius:13px;padding:14px 8px;font-size:14px;font-weight:900;flex:1}
.cam{background:#fff;color:#111}.demo{background:var(--blue);color:#fff}
.info{margin-top:8px;text-align:center;font-size:11px;color:#ddd}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
<video id="camera" autoplay playsinline muted></video>
<div id="fallback">🍄<br><br>GrzybAI Live<br><span style="font-size:13px;color:#888">Uruchom kamerę, aby rozpocząć skanowanie.</span></div>
<div class="ui">
 <div class="top"><div class="brand">🍄 GrzybAI</div><div class="live">LIVE AI</div></div>
 <div class="status" id="status">Kamera nieuruchomiona</div>
 <div class="scan"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><div class="scanline"></div></div>
 <div class="tag" id="tag">SZUKAM GRZYBA...</div>
 <div class="conf" id="conf">AI: oczekiwanie na obraz</div>
 <div class="bottom">
  <div class="warn">⚠️ AI jest pomocą. Nie używaj wyniku do potwierdzania jadalności grzyba.</div>
  <div class="row">
   <button class="cam" id="start">📷 URUCHOM KAMERĘ</button>
   <button class="demo" id="demo">🍄 ANALIZUJ TERAZ</button>
  </div>
  <div class="info" id="info">AI: BioCLIP • analiza obrazu w chmurze</div>
 </div>
</div>
</div>
<script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";

const v=document.getElementById('camera'), f=document.getElementById('fallback');
const status=document.getElementById('status'), tag=document.getElementById('tag');
const conf=document.getElementById('conf'), info=document.getElementById('info');
const startBtn=document.getElementById('start'), analyzeBtn=document.getElementById('demo');
const canvas=document.getElementById('frame') || (()=>{const c=document.createElement('canvas');c.id='frame';c.className='hidden';document.body.appendChild(c);return c;})();

let stream=null, aiClient=null, busy=false, timer=null;

const mushroomClasses = [
  "Amanita muscaria (muchomor czerwony)",
  "Amanita phalloides (muchomor sromotnikowy)",
  "Amanita pantherina (muchomor plamisty)",
  "Amanita rubescens (muchomor czerwieniejący)",
  "Boletus edulis (borowik szlachetny)",
  "Boletus pinophilus (borowik sosnowy)",
  "Boletus reticulatus (borowik usiatkowany)",
  "Imleria badia (podgrzybek brunatny)",
  "Suillus luteus (maślak zwyczajny)",
  "Tylopilus felleus (goryczak żółciowy)",
  "Leccinum scabrum (koźlarz babka)",
  "Leccinum aurantiacum (koźlarz czerwony)",
  "Cantharellus cibarius (pieprznik jadalny)",
  "Craterellus cornucopioides (lejkowiec dęty)",
  "Macrolepiota procera (czubajka kania)",
  "Chlorophyllum rhacodes (czubajka czerwieniejąca)",
  "Agaricus campestris (pieczarka polna)",
  "Coprinus comatus (czernidłak kołpakowaty)",
  "Armillaria mellea (opieńka miodowa)",
  "Pleurotus ostreatus (boczniak ostrygowaty)",
  "Flammulina velutipes (płomiennica zimowa)",
  "Lactarius deliciosus (mleczaj rydz)",
  "Russula cyanoxantha (gołąbek sinawy)",
  "Tricholoma equestre (gąska zielonka)",
  "Hypholoma fasciculare (łuszczak zmienny)",
  "Galerina marginata (hełmówka jadowita)",
  "Cortinarius rubellus (zasłonak rudy)",
  "Gyromitra esculenta (piestrzenica kasztanowata)",
  "Morchella esculenta (smardz jadalny)",
  "Sarcoscypha coccinea (czarka szkarłatna)",
  "not a mushroom / no mushroom"
].join("\n");

function extractName(raw){
  const s=String(raw||"").trim();
  const m=s.match(/\(([^)]+)\)/);
  return m ? m[1] : s;
}

function captureFrame(){
  const w=v.videoWidth||720, h=v.videoHeight||1280;
  const size=Math.min(w,h);
  const sx=(w-size)/2, sy=(h-size)/2;
  canvas.width=640; canvas.height=640;
  canvas.getContext('2d').drawImage(v,sx,sy,size,size,0,0,640,640);
  return new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.82));
}

async function connectAI(){
  if(aiClient) return;
  status.textContent='Łączę z BioCLIP...';
  info.textContent='AI: BioCLIP • łączenie...';
  aiClient=await Client.connect("imageomics/bioclip-demo");
  info.textContent='AI: BioCLIP • połączono';
}

async function analyze(){
  if(!stream || busy) return;
  busy=true; analyzeBtn.disabled=true;
  try{
    await connectAI();
    status.textContent='AI analizuje grzyba...';
    conf.textContent='AI: analiza obrazu...';

    const blob=await captureFrame();
    const result=await aiClient.predict("/zero_shot_classification",[
      handle_file(blob),
      mushroomClasses
    ]);

    const rawData=result?.data?.[0];
    const entries = rawData && typeof rawData === "object"
      ? Object.entries(rawData).sort((a,b)=>Number(b[1])-Number(a[1]))
      : [];

    if(!entries.length) throw new Error("Brak wyników klasyfikacji");

    const [raw,score]=entries[0];
    const pct=Math.max(0,Math.min(99,Math.round(Number(score)*100)));
    const name=extractName(raw);

    if(name.toLowerCase().includes("not a mushroom")){
      tag.textContent="NIE WYKRYTO GRZYBA";
      conf.textContent="AI: "+pct+"% zgodności z kategorią brak grzyba";
      status.textContent="Skieruj kamerę na grzyba";
    }else{
      tag.textContent="🍄 "+name.toUpperCase();
      conf.textContent="AI: "+pct+"% zgodności";
      status.textContent=pct>=65
        ?"Możliwe rozpoznanie • sprawdź drugi egzemplarz"
        :"Niska pewność • zbliż telefon do grzyba";
    }
  }catch(e){
    console.error(e);
    status.textContent='AI chwilowo niedostępne';
    conf.textContent='AI: błąd połączenia';
    info.textContent='Spróbuj ponownie za chwilę';
  }finally{
    busy=false; analyzeBtn.disabled=false;
  }
}

startBtn.onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    v.srcObject=stream; f.classList.add('hidden');
    status.textContent='Kamera aktywna • przygotowuję AI';
    startBtn.textContent='📷 KAMERA AKTYWNA';
    await analyze();
    clearInterval(timer);
    timer=setInterval(analyze,7000);
  }catch(e){
    console.error(e);
    status.textContent='Dostęp do kamery został zablokowany';
  }
};

analyzeBtn.onclick=analyze;
window.addEventListener('beforeunload',()=>{
  clearInterval(timer);
  stream?.getTracks().forEach(t=>t.stop());
});
</script>
</body>
</html>
